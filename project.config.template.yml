# Copy this file to project.config.yml. Keep one authoritative system per record type.
# Required inputs must be completed during bootstrap; optional values may remain null.

template:
  version: "0.6.0" # Required: starter version this project adopted.
  local_customizations: "workflow/LOCAL-CUSTOMIZATIONS.md" # Required: record project-specific deviations here.

project:
  name: null # Required.
  purpose: null # Required: one sentence; if unknown, use "to be discovered" during bootstrap.
  product_status: "undiscovered" # Required: undiscovered | discovery | specified | active | maintenance.
  owner: null # Required: person/role who approves product scope and external actions.
  agent_entry_points: ["AGENTS.md", "CLAUDE.md"] # Required: retain only the tools actually used.

systems_of_record:
  # Choose task management and knowledge storage independently during bootstrap.
  task_management:
    system: "choose_at_bootstrap" # Required: markdown | jira.
    location: null # Required: Jira project/key or repository task directory/plan path.
  knowledge:
    system: "choose_at_bootstrap" # Required: okf_markdown | notion.
    location: null # Required: OKF bundle path (commonly docs/knowledge/) or Notion workspace/database.
  # These operational records remain repository Markdown and are not OKF concepts.
  operational_records:
    session_handoffs: { system: "markdown", location: "docs/HANDOFF.md" }
    token_usage_reports: { system: "markdown", location: "docs/TOKEN_USAGE.md" }
  # If knowledge.system is okf_markdown, all durable knowledge in the configured bundle must conform to OKF.
  # If knowledge.system is notion, Notion is authoritative and do not maintain editable knowledge copies in the repo.
  # If task_management is markdown, use templates/task.md and templates/plan.md under the configured task location.

required_project_facts:
  stack: null # Required before implementation: language, runtime, major frameworks, persistence, deployment target, or "not selected".
  commands: null # Required before implementation: discovered test/build/lint commands, or "not available".
  privacy_and_security_constraints: null # Required: data classes, prohibited data, access boundaries, and known regulatory obligations.
  definition_of_done: null # Required before declaring work done: verification, review, documentation, and delivery bar.

workflow:
  branch_strategy: null # Optional: branch names, base branch, worktree/parallelism rules, or "no branches".
  task_statuses: ["draft", "ready", "in-progress", "blocked", "done"] # Optional: align with the task authority.
  task_size_limit: null # Optional: practical session/file/phase boundary; choose a limit suited to the project.
  reviewers: [] # Optional: reviewer roles and the conditions that trigger specialist review.
  approval_gates: ["product scope", "release or external state change"] # Optional: state who approves each gate and what a clear approval means.
  verification_commands: [] # Optional: exact commands after discovery; never invent command names.
  parallel_work_limit: 1 # Optional: number of concurrent implementation streams the project can safely support.
  session_handoff_location: "docs/HANDOFF.md" # Must agree with systems_of_record.operational_records.session_handoffs.
  token_optimizer_plugin: "token-optimizer" # Required before implementation; see workflow/TOKEN-OPTIMIZER.md.
  token_usage_reporting: "required_when_measurable" # Required: report actual measurements; mark unavailable when the platform exposes none.
  token_usage_source: null # Required before implementation: exact platform/session view or verified measurement source.
  okf_validation_command: null # Required when knowledge.system is okf_markdown; run locally and in the configured CI check.
  claude_usage_reporting:
    enabled: false # Optional; requires Claude Code and repository Markdown reporting.
    event_location: ".claude/usage/" # Local ignored event data; never commit raw usage events.
    report_location: "docs/CLAUDE_USAGE.md" # Generated completed-task summary.
    history_location: "docs/CLAUDE_USAGE_HISTORY.md" # Generated open/legacy lifecycle appendix.
    consolidation_point: null # Configure one event, e.g. after task merge to the default branch.
    consolidation_command: null # Exact project command, if an adapter is implemented; never assume one.

skills:
  required:
    - id: "token-optimizer"
      source: "https://github.com/alexgreensh/token-optimizer"
      version_or_revision: { claude_code: null, codex: null } # Fill the installed version/revision for each agent used.
  installed: [] # Optional: other exact skill IDs/paths available in this environment.
  third_party_installation_approved: false # Optional: install only specific reviewed skills, not entire collections.

integrations:
  approved: [] # Optional: list service, authorized account, allowed actions, and approval boundaries; empty means none configured.
